<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盲盒刮刮樂</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0f172a;color:white;
 font-family:Arial,"Microsoft JhengHei",sans-serif;
 text-align:center
}
header{
 padding:25px 10px;
 background:linear-gradient(135deg,#9333ea,#ec4899)
}
h1{margin:0;font-size:30px}
header p{margin:12px 0 0}

.info{
 width:92%;max-width:600px;margin:20px auto;
 padding:20px;background:#1e293b;border-radius:18px
}
.price{font-size:30px;font-weight:bold;color:#fbbf24}
.status{margin-top:12px;color:#cbd5e1}

#grid{
 width:94%;max-width:650px;margin:20px auto;
 display:grid;grid-template-columns:repeat(5,1fr);gap:10px
}
.card{
 aspect-ratio:1;border:0;border-radius:12px;
 background:#475569;color:white;font-size:20px;font-weight:bold
}
.card:active{transform:scale(.94)}
.card.used{background:#1f2937;color:#64748b}

.reset{
 margin:15px;padding:12px 18px;border:1px solid #64748b;
 border-radius:10px;background:none;color:white
}

#scratchPage{
 display:none;position:fixed;inset:0;z-index:10;
 background:#0f172a;padding:25px 15px
}
.back{
 display:block;background:none;border:0;color:white;
 font-size:17px;margin-bottom:20px
}
.scratchCard{
 position:relative;max-width:450px;height:260px;
 margin:20px auto;border-radius:20px;overflow:hidden;
 background:linear-gradient(135deg,#7c3aed,#db2777)
}
.prize{
 position:absolute;inset:0;display:flex;
 align-items:center;justify-content:center;
 font-size:28px;font-weight:bold;color:#fbbf24
}
canvas{
 position:absolute;inset:0;width:100%;height:100%;
 touch-action:none
}
#finish{
 display:none;margin:20px auto;padding:14px 25px;
 border:0;border-radius:10px;background:#22c55e;
 color:white;font-size:18px
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>

<body>

<header>
<h1>🎁 盲盒刮刮樂</h1>
<p>挑一個幸運號碼，刮開你的獎品！</p>
</header>

<div class="info">
每抽
<div class="price">NT$200</div>
<div class="status">
剩餘 <span id="remaining">40</span> / 40 抽
</div>
</div>

<div id="grid"></div>

<div id="scratchPage">

<button class="back" onclick="back()">← 返回選號</button>

<h2>
第 <span id="num"></span> 號
</h2>

<p>👇 用手指刮開銀色區域</p>

<div class="scratchCard" id="box">
<div class="prize" id="prize"></div>
<canvas id="canvas"></canvas>
</div>

<button id="finish" onclick="finish()">
🎉 確定並返回
</button>

</div>

<script>
  
const SUPABASE_URL = 'https://vcwhhlithgbqtretcuxs.supabase.co';
 const SUPABASE_KEY = 'sb_publishable_d6OhiynTp5_fZuw6QsfzIQ_kUdfWf3l';
 const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  async function testSupabase(){
  const { data, error } = await supabaseClient
    .from('scratch_cards')
    .select('*');

  console.log('Supabase資料：', data);
  console.log('Supabase錯誤：', error);
}

testSupabase();
const prizes=[
"🏆 A賞 大獎","🏆 B賞 大獎",
"🎁 C賞 盲盒","🎁 D賞 盲盒",
"🎁 E賞 盲盒","🎁 F賞 盲盒"
];

while(prizes.length<40)prizes.push("✨ 小獎");

for(let i=39;i>0;i--){
 let j=Math.floor(Math.random()*(i+1));
 [prizes[i],prizes[j]]=[prizes[j],prizes[i]];
}
let savedPrizes=localStorage.getItem("prizes");

if(savedPrizes){
  let oldPrizes=JSON.parse(savedPrizes);
  prizes.splice(0, prizes.length, ...oldPrizes);
}else{
  localStorage.setItem("prizes",JSON.stringify(prizes));
}
let used=JSON.parse(localStorage.getItem("used") || "[]");
let current=0;
let wonPrizes=JSON.parse(
  localStorage.getItem("wonPrizes") || "{}"
);
async function makeGrid(){

  const { data, error } = await supabaseClient
    .from('scratch_cards')
    .select('number, prize, used')
    .order('number');

  if(error){
    console.error('讀取 Supabase 失敗：', error);
    alert('讀取抽獎資料失敗');
    return;
  }

  const g = document.getElementById("grid");
  g.innerHTML = "";

  data.forEach(card => {

    const b = document.createElement("button");
    b.className = "card";
    b.textContent = String(card.number).padStart(2,"0");

    if(card.used){
      b.innerHTML =
        String(card.number).padStart(2,"0") +
        "<br>" +
        card.prize;

      b.classList.add("used");
      b.disabled = true;
    }

    b.onclick = () => openCard(card.number, card.prize);

    g.appendChild(b);
  });

  const remaining = data.filter(card => !card.used).length;

  document.getElementById("remaining").textContent = remaining;
}
function openCard(n, prize){
 current=n;

 document.getElementById("num").textContent=
   String(n).padStart(2,"0");

 document.getElementById("prize").textContent=
   prize;

 document.getElementById("scratchPage").style.display="block";
 document.getElementById("finish").style.display="none";

 setTimeout(scratch,50);
}
function scratch(){
 let c=document.getElementById("canvas");
 let box=document.getElementById("box");
 let w=box.clientWidth,h=box.clientHeight;

 c.width=w;c.height=h;
 c.style.opacity=1;

 let x=c.getContext("2d");
 x.globalCompositeOperation="source-over";
 x.fillStyle="#aeb6c2";
 x.fillRect(0,0,w,h);
 x.fillStyle="#334155";
 x.font="bold 22px Arial";
 x.textAlign="center";
 x.fillText("刮開看看！",w/2,h/2);

 let down=false,count=0;

 function rub(e){
  if(!down)return;
  let r=c.getBoundingClientRect();
  x.globalCompositeOperation="destination-out";
  x.beginPath();
  x.arc(e.clientX-r.left,e.clientY-r.top,15,0,Math.PI*2);
  x.fill();

  count++;
  if(count>120){
   c.style.opacity=0;
   document.getElementById("finish").style.display="block";
  }
 }

 c.onpointerdown=e=>{
  down=true;
  rub(e);
 };

 c.onpointermove=rub;

 c.onpointerup=()=>{
  down=false;
 };

 c.onpointercancel=()=>{
  down=false;
 };
}

async function finish(){
  const { data, error } = await supabaseClient
    .from('scratch_cards')
    .update({ used: true })
    .eq('number', current)
    .eq('used', false)
    .select();

  if(error){
    console.error("更新失敗：", error);
    alert("抽獎紀錄儲存失敗，請再試一次");
    return;
  }

  if(!data || data.length === 0){
    alert("這一格已經被其他人抽走了！");
    document.getElementById("scratchPage").style.display="none";
    await makeGrid();
    return;
  }

  document.getElementById("scratchPage").style.display="none";

  await makeGrid();
}

function back(){
 document.getElementById("scratchPage").style.display="none";
}

async function resetGame(){
  if(!confirm("確定重新開始嗎？所有抽獎紀錄都會清除並重新洗牌。")) return;

  const { error } = await supabaseClient.rpc("reset_scratch_game");

  if(error){
    console.error("重置失敗：", error);
    alert("重置失敗：" + error.message);
    return;
  }

  localStorage.removeItem("used");
  localStorage.removeItem("wonPrizes");
  localStorage.removeItem("prizes");

  alert("重新開始成功！");
  await makeGrid();
}

makeGrid();
</script>
<div style="text-align:center; margin:30px 0;">
  <button onclick="resetGame()">🔐 店家管理</button>
</div>
</body>
</html>
