<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盲盒刮刮樂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
}

header {
  padding: 25px 15px;
  background: linear-gradient(135deg, #9333ea, #ec4899);
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 12px 0 0;
  font-size: 18px;
}

.info {
  width: 92%;
  max-width: 600px;
  margin: 20px auto;
  padding: 20px;
  background: #1e293b;
  border-radius: 18px;
}

.info .price {
  color: #fbbf24;
  font-size: 30px;
  font-weight: bold;
}

.info .status {
  margin-top: 10px;
  color: #cbd5e1;
  font-size: 18px;
}

.grid {
  width: 94%;
  max-width: 650px;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.card {
  aspect-ratio: 1 / 1;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, #475569, #334155);
  color: white;
  font-size: 19px;
  font-weight: bold;
  box-shadow: 0 5px 12px #0005;
}

.card:active {
  transform: scale(0.94);
}

.card.used {
  background: #1f2937;
  color: #64748b;
}

.reset {
  margin: 20px 0 40px;
  padding: 12px 20px;
  border: 1px solid #64748b;
  border-radius: 12px;
  background: transparent;
  color: #cbd5e1;
  font-size: 16px;
}

/* 刮刮卡畫面 */

#scratchPage {
  display: none;
  position: fixed;
  inset: 0;
  background: #0f172a;
  z-index: 1000;
  overflow-y: auto;
}

.scratchBox {
  width: 92%;
  max-width: 500px;
  margin: 30px auto;
}

.back {
  display: block;
  margin-bottom: 20px;
  border: 0;
  background: transparent;
  color: #cbd5e1;
  font-size: 17px;
}

.numberTitle {
  font-size: 20px;
  margin-bottom: 15px;
}

.numberTitle strong {
  color: #fbbf24;
  font-size: 30px;
}

.hint {
  color: #cbd5e1;
  margin-bottom: 15px;
}

.scratchCard {
  position: relative;
  width: 100%;
  height: 260px;
  border-radius: 20px;
  overflow: hidden;
  background: linear-gradient(135deg, #7c3aed, #db2777);
  box-shadow: 0 10px 30px #0008;
}

.prize {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.prize small {
  font-size: 18px;
}

.prizeText {
  margin-top: 15px;
  padding: 0 15px;
  font-size: 30px;
  font-weight: bold;
  color: #fbbf24;
}

#scratchCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.doneText {
  display: none;
  margin-top: 20px;
  color: #4ade80;
  font-size: 20px;
  font-weight: bold;
}

.finishBtn {
  display: none;
  margin: 20px auto;
  padding: 14px 25px;
  border: 0;
  border-radius: 12px;
  background: #22c55e;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>🎁 盲盒刮刮樂</h1>
  <p>挑一個幸運號碼，刮開你的獎品！</p>
</header>

<div class="info">
  <div>每抽</div>
  <div class="price">NT$200</div>

  <div class="status">
    剩餘 <span id="remaining">40</span> / 40 抽
  </div>
</div>

<div class="grid" id="grid"></div>

<button class="reset" onclick="resetGame()">
  🔄 重新開始測試
</button>


<!-- 刮刮卡畫面 -->

<div id="scratchPage">

  <div class="scratchBox">

    <button class="back" onclick="goBack()">
      ← 返回選號
    </button>

    <div class="numberTitle">
      你選擇了<br>
      第 <strong id="numberText"></strong> 號
    </div>

    <div class="hint">
      👆 用手指把銀色區域刮開
    </div>

    <div class="scratchCard" id="scratchCard">

      <div class="prize">
        <small>你抽中了</small>
        <div class="prizeText" id="prizeText"></div>
      </div>

      <canvas id="scratchCanvas"></canvas>

    </div>

    <div class="doneText" id="doneText">
      🎉 刮開完成！
    </div>

    <button
      class="finishBtn"
      id="finishBtn"
      onclick="finishScratch()">
      確定並返回
    </button>

  </div>

</div>


<script>

/* ==============================
   獎品設定
============================== */

const prizes = [
  "🏆 A賞 大獎",
  "🏆 B賞 大獎",
  "🎁 C賞 盲盒",
  "🎁 D賞 盲盒",
  "🎁 E賞 盲盒",
  "🎁 F賞 盲盒"
];

/* 補滿 40 個獎項 */

while (prizes.length < 40) {
  prizes.push("✨ 小獎");
}

/* 隨機排列獎品 */

for (let i = prizes.length - 1; i > 0; i--) {

  const j = Math.floor(Math.random() * (i + 1));

  const temp = prizes[i];
  prizes[i] = prizes[j];
  prizes[j] = temp;

}


/* ==============================
   基本資料
============================== */

const grid = document.getElementById("grid");

let usedNumbers = [];

let currentNumber = null;


/* ==============================
   建立 40 個號碼
============================== */

function createGrid() {

  grid.innerHTML = "";

  for (let i = 1; i <= 40; i++) {

    const button = document.createElement("button");

    button.className = "card";

    button.innerText =
      String(i).padStart(2, "0");

    if (usedNumbers.includes(i)) {

      button.classList.add("used");

      button.innerText = "已抽";

      button.disabled = true;

    }

    button.addEventListener("click", function() {

      openScratch(i);

    });

    grid.appendChild(button);

  }

  document.getElementById("remaining").innerText =
    40 - usedNumbers.length;

}


/* ==============================
   開啟刮刮卡
============================== */

function openScratch(number) {

  currentNumber = number;

  document.getElementById("numberText").innerText =
    String(number).padStart(2, "0");

  document.getElementById("prizeText").innerText =
    prizes[number - 1];

  document.getElementById("scratchPage").style.display =
    "block";

  document.getElementById("doneText").style.display =
    "none";

  document.getElementById("finishBtn").style.display =
    "none";

  setTimeout(setupScratch, 100);

}


/* ==============================
   建立銀色刮刮層
============================== */

function setupScratch() {

  const canvas =
    document.getElementById("scratchCanvas");

  const card =
    document.getElementById("scratchCard");

  const width = card.clientWidth;
  const height = card.clientHeight;

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    width * ratio;

  canvas.height =
    height * ratio;

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";

  const ctx =
    canvas.getContext("2d");

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      width,
      height
    );

  gradient.addColorStop(
    0,
    "#d1d5db"
  );

  gradient.addColorStop(
    0.5,
    "#94a3b8"
  );

  gradient.addColorStop(
    1,
    "#e5e7eb"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle = "#475569";

  ctx.font =
    "bold 24px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    "刮開看看你抽到什麼！",
    width
